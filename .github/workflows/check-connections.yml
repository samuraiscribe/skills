name: Check connections

# Services move their MCP servers. Once a week, ask every connection's server
# whether the app can still sign in there; a failed run is the signal.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ask every connection's server
        run: python3 scripts/check_connections.py
