name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every skill and connection against SPEC.md
        run: python3 scripts/validate.py

  connections:
    # Asks the services themselves, so only when a connection changed.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed connections' servers
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- connections/ \
            | cut -d/ -f2 | sort -u | while read -r id; do
                [ -f "connections/$id/connection.json" ] && echo "$id"
              done)
          if [ -z "$changed" ]; then echo "No connection changed"; exit 0; fi
          python3 scripts/check_connections.py $changed
